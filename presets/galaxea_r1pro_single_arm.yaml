description: "Galaxea R1Pro single-arm recommended cleaning parameters."

recommended_rules:
  video_integrity:
    enabled: true

  timestamp_alignment:
    enabled: true
    on_mismatch: warn_only

  numeric_sanity:
    enabled: true
    on_nan: drop_episode
    on_inf: drop_episode
    outlier_mode: warn

  gripper_binarize:
    enabled: true
    threshold: 0.5
    mode: binary_01
    targets:
      - state.gripper
      - action.gripper

  static_frame_trim:
    enabled: true
    mode: trim_edges
    source: action
    pos_threshold: 2.0e-3

  episode_length_filter:
    enabled: true
    min_frames: 30
