# Embodiment spec: DROID Franka (verified against 数据实例/droid_100_lerobotv3).
# Generate the LingBot config pair from a v3.0 dataset with:
#   lerobot-cleaner generate-lingbot-config <dataset> --spec configs/embodiments/droid_franka.yaml
name: droid_franka
model:
  model_path: robbyant/lingbot-vla-4b
  tokenizer_path: Qwen/Qwen2.5-VL-3B-Instruct
joints:
  # DROID state/action layout: [0:7] arm joints, [7:8] continuous gripper.
  # capacity pads measured dims into LingBot's dual-arm slots (7 joints -> 14, 1 gripper -> 2).
  - name: arm.position
    capacity: 14
    state:
      - {feature: observation.state, start: 0, end: 7}
    action:
      - {feature: action, start: 0, end: 7}
    # Absolute positions. Deltas (true) require deployment changes + recomputed norm stats.
    subtract_state: false
  - name: effector.position
    capacity: 2
    state:
      - {feature: observation.state, start: 7, end: 8}
    action:
      - {feature: action, start: 7, end: 8}
    # LingBot forbids deltas on effector/end position.
    subtract_state: false
cameras:
  - {name: camera_exterior_1, feature: observation.images.exterior_1_left}
  - {name: camera_exterior_2, feature: observation.images.exterior_2_left}
  - {name: camera_wrist_left, feature: observation.images.wrist_left}
data:
  num_workers: 4
train:
  micro_batch_size: 1  # starting point only; choose for actual GPU memory
