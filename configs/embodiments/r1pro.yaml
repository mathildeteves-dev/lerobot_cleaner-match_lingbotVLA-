# UNVERIFIED embodiment template: Galaxea R1Pro dual arm.
# 16-dim interleaved layout: [0:7] left arm, [7:8] left gripper,
# [8:15] right arm, [15:16] right gripper — hence the non-contiguous slices.
# Multi-slice arms are concatenated in slice order; verify against a real v3
# dataset before use. Delta arms (subtract_state: true) need matching deployment.
name: r1pro
model:
  model_path: robbyant/lingbot-vla-4b
  tokenizer_path: Qwen/Qwen2.5-VL-3B-Instruct
joints:
  - name: arm.position
    capacity: 14
    state:
      - {feature: observation.state, start: 0, end: 7}
      - {feature: observation.state, start: 8, end: 15}
    action:
      - {feature: action, start: 0, end: 7}
      - {feature: action, start: 8, end: 15}
    subtract_state: true
  - name: effector.position
    capacity: 2
    state:
      - {feature: observation.state, start: 7, end: 8}
      - {feature: observation.state, start: 15, end: 16}
    action:
      - {feature: action, start: 7, end: 8}
      - {feature: action, start: 15, end: 16}
    subtract_state: false
cameras:
  - {name: camera_top, feature: observation.images.ego_view}
data:
  num_workers: 8
train:
  micro_batch_size: 32
