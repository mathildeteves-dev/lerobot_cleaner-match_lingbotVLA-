# UNVERIFIED R1Pro template; use droid_franka.yaml for the supplied sample.
model:
  model_path: robbyant/lingbot-vla-4b
  tokenizer_path: Qwen/Qwen2.5-VL-3B-Instruct

data:
  datasets_type: vla

  # 对应 configs/robot_configs/r1pro.yaml
  data_name: r1pro
  robot_config_root: configs/robot_configs

  # 建议运行时通过命令行替换成真实绝对路径
  train_path: /path/to/r1pro_clean_v30

  joints:
    - arm.position: 14
    - effector.position: 2

  cameras:
    - camera_top

  num_workers: 8
  norm_type: meanstd
  norm_stats_file: assets/norm_stats/r1pro.json

train:
  output_dir: output/r1pro

  data_parallel_mode: fsdp2
  enable_full_shard: false
  module_fsdp_enable: true
  use_compile: true

  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1
  freeze_vision_encoder: false

  tokenizer_max_length: 72
  max_action_dim: 75
  max_state_dim: 75

  lr: 5.0e-5
  lr_decay_style: constant
  micro_batch_size: 32
  gradient_accumulation_steps: 1
  max_steps: 40000

  ckpt_manager: dcp
  save_steps: 10000
  save_epochs: 0
  enable_fp32: true
  enable_resume: true
