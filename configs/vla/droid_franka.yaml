# Data-specific starting configuration; training hardware/checkpoint not tested here.
# scripts/run_lingbot_norm.py supplies absolute paths at launch time.
model:
  model_path: robbyant/lingbot-vla-4b
  tokenizer_path: Qwen/Qwen2.5-VL-3B-Instruct
data:
  datasets_type: vla
  data_name: droid_franka
  robot_config_root: configs/robot_configs
  train_path: /REPLACE_WITH_ABSOLUTE_PATH/droid_100_clean_v3
  joints:
    - arm.position: 14  # seven measured joints; remaining slots are padding, not a right arm
    - effector.position: 2  # one measured gripper; remaining slot is padding
  cameras:
    - camera_exterior_1
    - camera_exterior_2
    - camera_wrist_left
  num_workers: 4
  norm_type: meanstd
  norm_stats_file: assets/norm_stats/droid_franka.json
train:
  output_dir: output/droid_franka
  data_parallel_mode: fsdp2
  enable_full_shard: false
  module_fsdp_enable: true
  use_compile: true
  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1
  freeze_vision_encoder: false
  tokenizer_max_length: 72
  max_action_dim: 75
  max_state_dim: 75
  lr: 5.0e-5
  lr_decay_style: constant
  micro_batch_size: 1  # starting point only; choose for actual GPU memory
  gradient_accumulation_steps: 1
  max_steps: 40000
  ckpt_manager: dcp
  save_steps: 10000
  save_epochs: 0
  enable_fp32: true
  enable_resume: true
